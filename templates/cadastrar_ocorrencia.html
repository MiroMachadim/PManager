<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PManager - Cadastrar Ocorrência</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .top-bar, .footer-bar {
            background-color: #A31D1D;
            color: white;
            padding: 15px 20px;
        }
        .top-bar {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar a.nav-btn {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 5px 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .top-bar a.nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .footer-bar {
            margin-top: auto;
            text-align: center;
            font-size: 0.85rem;
        }
        .form-card {
            max-width: 650px;
            width: 100%;
            margin: auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .section-title {
            color: #A31D1D;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 2px solid #A31D1D;
            padding-bottom: 6px;
            margin-bottom: 18px;
        }
        .btn-custom-red {
            background-color: #A31D1D;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-custom-red:hover {
            background-color: #821515;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            border-color: #A31D1D;
            box-shadow: 0 0 0 0.2rem rgba(163, 29, 29, 0.25);
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <span>PManager</span>
        <a href="javascript:history.back()" class="nav-btn">Voltar</a>
    </div>

    <!-- Conteúdo Principal -->
    <div class="container d-flex flex-column justify-content-center align-items-center my-5">
        <div class="form-card">
            <h3 class="fw-bold text-dark text-center mb-1">Cadastrar Ocorrência</h3>
            <p class="text-muted text-center mb-4">Preencha os dados abaixo para registrar a ocorrência no sistema.</p>

            <form action="{{ url_for('cadastro.cad_ocorrencia') }}" method="POST">

                <!-- Seção 1: Localização -->
                <div class="section-title">Localização</div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="uf" class="form-label text-secondary fw-semibold">Estado (UF)</label>
                        <select class="form-select" id="uf" name="estado" required onchange="carregarCidades(this.value)">
                            <option value="" selected disabled>Selecione o Estado</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="cidade" class="form-label text-secondary fw-semibold">Cidade</label>
                        <select class="form-select" id="cidade" name="cidade" required disabled>
                            <option value="" selected disabled>Selecione a Cidade</option>
                        </select>
                    </div>
                </div>

                <!-- Seção 2: Ocorrência -->
                <div class="section-title">Dados da Ocorrência</div>

                <div class="mb-3">
                    <label for="tipo_crime" class="form-label text-secondary fw-semibold">Tipo do Crime</label>
                    <input type="text" class="form-control" id="tipo_crime" name="tipo_crime" placeholder="Ex: Furto, Roubo, Agressão..." required>
                </div>

                <div class="mb-3">
                    <label for="cpf_vitima" class="form-label text-secondary fw-semibold">CPF da Vítima</label>
                    <input type="text" class="form-control" id="cpf_vitima" name="cpf_vitima" placeholder="000.000.000-00" maxlength="14" oninput="mascaraCPF(this)" required>
                </div>

                <div class="mb-4">
                    <label for="descricao" class="form-label text-secondary fw-semibold">Descrição do Acontecimento</label>
                    <textarea class="form-control" id="descricao" name="descricao" rows="5" placeholder="Descreva os detalhes do ocorrido..." required></textarea>
                </div>

                <!-- Botão de Envio -->
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-custom-red py-2 fw-semibold">Abrir Ocorrência</button>
                </div>

            </form>
        </div>
    </div>

    <!-- Rodapé -->
    <div class="footer-bar">
        &copy; 2026 PManager. Todos os Direitos reservados a Miro Machado e Allan Gabryel.
    </div>

    <!-- Scripts de Funcionalidade -->
    <script>
        function mascaraCPF(input) {
            let value = input.value.replace(/\D/g, "");
            if (value.length > 11) value = value.slice(0, 11);

            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d)/, "$1.$2");
            value = value.replace(/(\d{3})(\d{1,2})$/, "$1-$2");

            input.value = value;
        }

        document.addEventListener("DOMContentLoaded", function() {
            fetch("https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome")
                .then(response => response.json())
                .then(data => {
                    const ufSelect = document.getElementById("uf");
                    data.forEach(uf => {
                        let option = document.createElement("option");
                        option.value = uf.sigla;
                        option.textContent = `${uf.nome} (${uf.sigla})`;
                        ufSelect.appendChild(option);
                    });
                });
        });

        function carregarCidades(siglaUF) {
            const cidadeSelect = document.getElementById("cidade");
            cidadeSelect.disabled = true;
            cidadeSelect.innerHTML = '<option value="" selected disabled>Carregando cidades...</option>';

            fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${siglaUF}/municipios?orderBy=nome`)
                .then(response => response.json())
                .then(data => {
                    cidadeSelect.innerHTML = '<option value="" selected disabled>Selecione a Cidade</option>';
                    data.forEach(cidade => {
                        let option = document.createElement("option");
                        option.value = cidade.nome;
                        option.textContent = cidade.nome;
                        cidadeSelect.appendChild(option);
                    });
                    cidadeSelect.disabled = false;
                });
        }
    </script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
