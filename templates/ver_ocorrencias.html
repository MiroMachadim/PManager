<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PManager - Ocorrências</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .top-bar, .footer-bar {
            background-color: #A31D1D;
            color: white;
            padding: 15px 20px;
        }
        .top-bar {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar a.nav-btn {
            color: white;
            text-decoration: none;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 5px 12px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .top-bar a.nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
        }
        .footer-bar {
            margin-top: auto;
            text-align: center;
            font-size: 0.85rem;
        }
        .home-card {
            max-width: 500px;
            width: 100%;
            margin: auto;
            padding: 20px;
            text-align: center;
        }
        .btn-custom-red {
            background-color: #A31D1D;
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-custom-red:hover {
            background-color: #821515;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <span>PManager</span>
        <a href="javascript:history.back()" class="nav-btn">Voltar</a>
    </div>

    <!-- Conteúdo Principal do Hub de Ocorrências -->
    <div class="container d-flex flex-column justify-content-center align-items-center my-5">
        <div class="home-card">
            <h2 class="fw-bold text-dark mb-1">Ocorrências</h2>
            <p class="text-muted mb-4">Selecione a ação que deseja realizar</p>

            <!-- Menu com as 2 opções -->
            <div class="d-grid gap-3">
                <a href="{{ url_for('lista.list_ocorrencia')}}" class="btn btn-custom-red shadow-sm py-3 fs-6">Editar Ocorrências</a>
                <a href="{{ url_for('grafico.grafico')}}" class="btn btn-custom-red shadow-sm py-3 fs-6">Ver Gráfico de Ocorrências</a>
            </div>
        </div>
    </div>

    <!-- Rodapé -->
    <div class="footer-bar">
        &copy; 2026 PManager. Todos os Direitos reservados a Miro Machado e Allan Gabryel.
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
